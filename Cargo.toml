[workspace]
resolver = "3"
members = ["crates/orrery-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
repository = "https://github.com/jschweitzer/orrery"

[workspace.dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.30", features = ["bytemuck", "serde"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.9"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
