[workspace]
resolver = "3"
members = ["crates/orrery-core", "crates/orrery-render", "crates/orrery-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
repository = "https://github.com/jschweitzer/orrery"

[workspace.dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.33", features = ["bytemuck", "serde"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.9"
wgpu = "30"
winit = "0.30"
pollster = "1.0"
log = "0.4"
env_logger = "0.11"
notify = "8"
orrery-core = { path = "crates/orrery-core" }
orrery-render = { path = "crates/orrery-render" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
