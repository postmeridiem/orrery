# Orrery configuration.
#
# Every value below is the shipped default, so deleting this file changes
# nothing. Any key may be omitted. Unknown keys are an error rather than being
# silently ignored, because a wallpaper has no console to complain to.
#
# The renderer re-reads this file whenever it is saved.

[camera]
# Angle above the ecliptic plane. 90 looks straight down on the solar system,
# 0 is edge-on. The default is the oblique three-quarter view that makes the
# orbits read as ellipses rather than circles.
elevation_deg = 27.0
# Rotation about the ecliptic pole: spins the whole system within the frame.
azimuth_deg = 0.0
# Roll about the view axis: tilts the horizon.
roll_deg = 0.0
fov_deg = 50.0
# Multiplier on the automatically computed framing distance. Above 1 pulls back.
zoom = 1.0
# Minutes for the camera to travel once around the Sun. Zero holds still.
#
# This is what makes the constellations legible: the patch of sky in view sits
# behind the Sun, so circling the Sun walks that patch through every ecliptic
# longitude. An hour shows the whole band. Set it to 1.0 to evaluate a full
# circuit quickly -- the orrery turns with it, since the camera really is
# orbiting.
rotation_period_minutes = 60.0

# Days for the viewpoint to rise above the ecliptic and sink below it again,
# and how far it travels. Zero holds the elevation fixed.
#
# A fixed elevation only ever sees one band of sky, and from above the plane
# that band is southern -- the northern constellations can never appear at all.
# Letting the viewpoint drift below the plane and back brings the rest of the
# sky into reach, slowly. Try elevation_cycle_days = 7.0.
elevation_cycle_days = 0.0
elevation_cycle_deg = 40.0
# Fraction of the frame the outermost drawn thing spans. Honoured exactly, at
# every aspect ratio.
fill = 0.94
# Where through each debris belt the left and right screen edges fall, as a
# fraction of the belt's width. 0.5 puts them on the middle of the Kuiper belt,
# so its outer half runs off the sides. That is what stops the belt dictating
# the scale of the whole picture and crushing the planets into the centre.
#
# It does mean the camera sits within the belt rather than outside it, and that
# the outermost orbit sweeps off the edges. That is unavoidable rather than a
# defect: the near side of an outer orbit is always far closer to the camera
# than the far side, so containing it entirely means retreating until
# everything is tiny. Raise this to pull back, lower it to come closer.
frame_belt_fraction = 0.5

# Fit to the frame's *width* rather than to whichever axis binds first.
#
# On a wide monitor the solar system is far wider than it is tall, so fitting
# both axes leaves it floating with the width unused. Filling the width means
# the vertical extent must fit too -- and that is a function of the tilt: a ring
# spanning the full width projects to about `fill * aspect * sin(elevation)` of
# the half-height. On a 21:9 screen that overflows above roughly 25 degrees, so
# rather than let it clip, the elevation is automatically lowered until it fits.
# Your `elevation_deg` is therefore a maximum, not an exact value.
fit_width = true
# Shift the system within the frame, in fractions of the viewport. Handy for
# keeping the Sun out from behind a column of desktop icons.
offset_x = 0.0
offset_y = 0.0

[time]
# "live" tracks the clock; "fixed" freezes at `date`.
mode = "live"
# Optional, "YYYY-MM-DD" or "YYYY-MM-DDTHH:MM:SS", UTC.
# date = "2026-08-03"

# Simulated days per real second.
#
# 0 is real time: what you see is the true configuration of the solar system at
# this moment. Anything else means the picture is the real solar system at some
# *other* time, which is why the default is 0.
#
# Set it to 1 to watch the system actually turn -- Mercury laps its orbit in
# about ninety seconds.
days_per_second = 0.0

[scale.orbit]
# How heliocentric distance becomes distance on screen. Only the radius is ever
# rescaled, never the direction, so every planet's heliocentric longitude and
# latitude -- and so every conjunction and alignment -- stays exact.
#
#   law = "linear"       true to scale; needs `zoom` to frame the inner system
#   law = "power"        r^exponent; the classic orrery compression
#   law = "logarithmic"  more aggressive in the outer system
#
# Neptune orbits 78 times further out than Mercury. Drawn honestly with Neptune
# in frame, the terrestrial planets are a smudge, which is what the default
# compression exists to fix.
law = "power"
units_per_au = 1.0
exponent = 0.45

# For true scale instead:
#   law = "linear"
#   units_per_au = 1.0

[scale.body]
# Drawn radius of an Earth-sized body, in scene units. Earth's true radius is
# 4.3e-5 AU, so at any framing that shows the orbits, real sizes are sub-pixel.
earth_radius_units = 0.054
# 1.0 keeps true relative sizes (Jupiter 11x Earth); lower pulls them together.
exponent = 0.4
# The Sun alone is 109 Earth radii and tends to dominate; this dials it back
# without touching the planets.
sun_multiplier = 0.85

[sky]
# Change this for an entirely different sky. Any value is as good as any other.
seed = 186081005
star_density = 1.0
star_brightness = 1.0
# The galactic band is placed using the real IAU galactic pole, so it crosses
# the solar system at its true angle of roughly 60 degrees to the ecliptic.
milky_way = 0.40
nebula = 0.35
# Lifts the darkest sky off pure black. Planet night sides are handled
# separately, under [lighting].
ambient = 0.018
rotation_deg = 0.0

# The real sky. 8,404 catalogued stars to magnitude 6.5 -- the whole naked-eye
# sky -- at their true positions, with real magnitudes and colours from their
# B-V index. See data/SOURCES.md for provenance and licensing.
real_stars = true
magnitude_limit = 6.5

# Constellation figures for the 20 major constellations. Deliberately drawn
# very faint: they are meant to be found by someone looking for them, not to
# turn the wallpaper into a star chart. Raise toward 0.5 to actually study them.
constellations = true
constellation_opacity = 0.10
# Fraction of a figure's stars that must lie behind the Sun before it is drawn.
# The viewpoint looks down at the Sun from outside, so the far side of it is the
# middle of the picture. There is deliberately no "must fit on screen" rule:
# almost every constellation is larger than the visible band, so demanding whole
# figures meant nothing was ever drawn.
constellation_min_behind_sun = 0.8

# 23 curated deep-sky objects at their true positions -- Orion, Andromeda, the
# Pleiades, the Magellanic Clouds and so on.
#
# Off for now: the procedural rendering of them is not good enough to earn its
# place. The catalogue and the positions are sound, so this is a rendering
# problem to revisit rather than a data one. Set true to see them.
deep_sky = false
deep_sky_opacity = 0.55

[orbits]
enabled = true
width_px = 1.4
opacity = 0.34
# How much brighter the ring is just behind each planet, which gives a sense of
# which way it is travelling. 0 draws a uniform ring.
trail_strength = 2.2
trail_length = 0.22
segments = 512

[render]
# A wallpaper has no business running at the display's refresh rate.
fps = 30
# 1, 2, 4 or 8.
msaa = 4
exposure_stops = 0.0
bloom_intensity = 0.09
bloom_radius = 0.06
vsync = true
resolution_scale = 1.0

[ephemeris]
# Where positions come from.
#
# With this on, the orrery asks JPL Horizons once a year for the real
# osculating orbit of each planet at monthly epochs, and propagates from
# whichever epoch is nearest. That takes worst-case error from 0.074 degrees
# (Saturn, where the Jupiter-Saturn great inequality defeats the built-in
# linear element rates) down to about 0.08 arcseconds.
#
# The request carries a body number and a list of dates and nothing else. It
# runs on a background thread and never delays a frame, and every failure --
# offline, blocked, JPL down -- falls back silently to the built-in tables.
# Set online = false to never touch the network; the orrery still renders the
# correct sky, just to 0.11 degrees instead.
online = true
refresh_days = 365.0

[lighting]
# How the unlit side of a planet is drawn.
#
# Physically it is black -- but planets between you and the Sun then become
# invisible silhouettes, which is half of them at any time. So the terminator is
# modelled as mainly a *saturation* gradient rather than a brightness one: the
# night side keeps most of its luminance and loses most of its colour. You can
# still see the planet, and sunlight is still visibly what gives it its hue.
#
# Luminance of the fully unlit side, relative to the lit side. Raise it to see
# more of the night side; 0.0 is physically honest and mostly black.
night_brightness = 0.30
# How much colour survives on the unlit side. Low drains it toward grey.
night_saturation = 0.15
# Chroma of the fully lit side. Above 1.0 pushes past the body's true albedo.
#
# This is what makes the effect work on the gas giants: their real colours are
# low-chroma creams, so draining saturation from them barely registers and they
# just go pale. Boosting the lit side gives the terminator something to contrast
# against.
day_saturation = 1.35

# How brightly the Sun's surface emits, in HDR units. It is the only emissive
# body, so this also sets how far its bloom reaches -- turn it down and the
# inner planets stop being washed out by the glare of something they orbit
# very close to.
sun_intensity = 6.0

[bodies]
# Case-insensitive. Pluto is off by default: it is not a planet, and its 17
# degree inclination sits it awkwardly outside the plane of the others.
show = ["Mercury", "Venus", "Earth", "Mars", "Jupiter", "Saturn", "Uranus", "Neptune"]
moon = true
# The Moon's true separation collapses to nothing under any useful compression,
# so it is pushed out to stay visible. Its *direction* from Earth is still the
# real one, so the phase and the side it sits on read correctly.
moon_distance_boost = 3.5
asteroid_belt = true
# The Kuiper belt, beyond Neptune. This is the outermost thing in the scene, so
# switching it on pulls the camera back and shrinks everything else.
kuiper_belt = true
# Particles in the asteroid belt; the Kuiper belt gets 1.6x, being wider.
belt_particles = 6000
